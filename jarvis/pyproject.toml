[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Secure multi-provider Jarvis core for fullstack-agent (OpenAI-first, Claude/Ollama ready)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
